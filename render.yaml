# Render Blueprint — New > Blueprint in the Render dashboard, point it at this repo, and it
# creates the API web service.
#
# The scheduled cleanup is NOT defined here: Render Cron Jobs have no free plan (minimum $1
# per job per month), so the job runs from cron-job.org against /api/maintenance/cleanup
# instead. See the README.
#
# The database is deliberately NOT defined here: Render's free Postgres expires after 30 days,
# so this setup expects an external Postgres (Neon's free tier doesn't expire) supplied as
# DATABASE_URL. See the README.
#
# To use Render's own managed Postgres instead, uncomment this block and change the
# DATABASE_URL env var below from `sync: false` to the `fromDatabase` form shown there:
#
# databases:
#   - name: zegin-db
#     databaseName: zeginhealthhub
#     user: zegin
#     plan: free          # expires after 30 days; `basic-256mb` and up do not
#
# Only the frontend is missing on purpose: that goes to Vercel (see README).

services:
  - type: web
    name: zegin-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Paste the Neon connection string (the pooled one, ending -pooler) into the Render
      # dashboard after the first deploy. sync: false means "prompt me, don't store it here".
      #
      # With Render's own Postgres instead, replace these two lines with:
      #   fromDatabase:
      #     name: zegin-db
      #     property: connectionString
      - key: DATABASE_URL
        sync: false
      # Set this in the dashboard once the Vercel URL exists. Comma-separated; a leading
      # wildcard label is allowed so preview deploys keep working:
      #   https://zegin-health-hub.vercel.app,https://*.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Render generates this once and keeps it; the cron job below reads the same value.
      - key: MAINTENANCE_TOKEN
        generateValue: true
      - key: Maintenance__RetentionDays
        value: "90"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
