# The whole stack — Postgres, the ASP.NET API and the built React app behind nginx.
#
# This file is what RepoRun deploys, so it sticks to the subset RepoRun accepts: no
# `restart`, `ports`, `profiles`, `build.args` or named volumes, and every service sets
# `cpus` and `mem_limit`. The local-only bits (published ports, restart policy, a named
# database volume, the optional cron container) live in docker-compose.override.yml, which
# `docker compose up --build` merges in automatically — locally nothing changes, open
# http://localhost:8080.
#
# This deliberately uses Postgres rather than the SQLite file the local `dotnet run` flow
# defaults to, so that what you run here matches what the deployed app runs against.

services:
  db:
    image: postgres:17-alpine
    cpus: 0.2
    mem_limit: 192m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zegin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zegin_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-zeginhealthhub}
    # RepoRun only allows repo-relative bind mounts, with persistent data under .stack-data/;
    # locally the override swaps this for the named `db-data` volume.
    volumes:
      - ./.stack-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zegin} -d ${POSTGRES_DB:-zeginhealthhub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    cpus: 0.2
    mem_limit: 256m
    environment:
      # The API also retries on its own at startup, but waiting for the healthcheck keeps the
      # first-run logs clean.
      DATABASE_URL: postgresql://${POSTGRES_USER:-zegin}:${POSTGRES_PASSWORD:-zegin_dev_password}@db:5432/${POSTGRES_DB:-zeginhealthhub}?sslmode=disable
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      MAINTENANCE_TOKEN: ${MAINTENANCE_TOKEN:-local-dev-maintenance-token}
      Maintenance__RetentionDays: ${ANALYTICS_RETENTION_DAYS:-90}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      db:
        condition: service_healthy

  web:
    # VITE_API_BASE_URL is left at the Dockerfile's empty default — nginx proxies /api to the
    # api service, so the SPA's relative requests are same-origin.
    build:
      context: ./client
    cpus: 0.1
    mem_limit: 64m
    depends_on:
      api:
        condition: service_healthy
