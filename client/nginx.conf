server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Docker's embedded DNS. Putting the upstream in a variable makes nginx re-resolve it at
    # request time instead of once at startup, so a restarted API container (new IP) is found.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://zegin-api:8080;

    # Stands in for the Vite dev proxy: the SPA keeps calling a relative /api/... path, and
    # nginx forwards it to the API container, so the browser never makes a cross-origin call.
    location /api/ {
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Hashed filenames, so these can never go stale.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: /blog, /articles/3 and friends are not real files on disk, so
    # anything that doesn't resolve falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
